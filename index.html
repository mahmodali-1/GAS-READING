<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Furnace Gas Monitor · Midal Cables</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" integrity="sha384-dug+JxfBvklEQdJ4AYuBBAIScUz0bVN73xpy273gcAwHjb3qI0fXmuYNaNfdyYJG" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root{
  --brand:#0B109F; --brand-ink:#0B109F; --brand-deep:#070A6B; --brand-tint:#ECEEFB; --brand-soft:#B9BCEB;
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#F8F9FC; --line:#DDE0EA; --line-strong:#C5C9D8;
  --ink:#141730; --ink-2:#3B4060; --muted:#6C728C;
  --amber:#C77A00; --amber-bg:#FFF4DE; --red:#C42B3D; --red-bg:#FDECEE; --green:#1B8A5A; --green-bg:#E4F5EC;
  --idle:#A7ACBF; --head:#0B109F; --head-ink:#FFFFFF; --tf:#1C9AD6;
  --radius:10px; --radius-sm:6px;
  --font:'Lato', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#8C92FF; --brand-ink:#A9AEFF; --brand-deep:#C9CCFF; --brand-tint:#1D2150; --brand-soft:#3C4190;
    --bg:#0D0F1A; --surface:#161927; --surface-2:#1B1F30; --line:#2A2F46; --line-strong:#3A4060;
    --ink:#E8EAF4; --ink-2:#C3C7DA; --muted:#9097B3;
    --amber:#F1B24A; --amber-bg:#3A2C10; --red:#FF7D8C; --red-bg:#3D161D; --green:#5FD39B; --green-bg:#12301F;
    --idle:#596080; --head:#070A5C; --head-ink:#FFFFFF; --tf:#56C1F0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand:#8C92FF; --brand-ink:#A9AEFF; --brand-deep:#C9CCFF; --brand-tint:#1D2150; --brand-soft:#3C4190;
  --bg:#0D0F1A; --surface:#161927; --surface-2:#1B1F30; --line:#2A2F46; --line-strong:#3A4060;
  --ink:#E8EAF4; --ink-2:#C3C7DA; --muted:#9097B3;
  --amber:#F1B24A; --amber-bg:#3A2C10; --red:#FF7D8C; --red-bg:#3D161D; --green:#5FD39B; --green-bg:#12301F;
  --idle:#596080; --head:#070A5C; --head-ink:#FFFFFF; --tf:#56C1F0; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
a{color:var(--brand-ink)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Header ---------- */
.top{background:var(--head);color:var(--head-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{display:flex;align-items:center;gap:24px;padding:0 24px;min-height:64px}
.logo{height:44px;width:auto;filter:brightness(0) invert(1);display:block}
.app-name{font-weight:300;font-size:18px;letter-spacing:.01em;padding-left:20px;border-left:1px solid rgba(255,255,255,.28);white-space:nowrap}
.nav{display:flex;gap:4px;margin-left:auto;align-self:stretch}
.nav button{background:none;border:0;color:rgba(255,255,255,.78);padding:0 14px;cursor:pointer;font-weight:700;font-size:14px;border-bottom:3px solid transparent;border-top:3px solid transparent;white-space:nowrap}
.nav button:hover{color:#fff}
.nav button[aria-current="page"]{color:#fff;border-bottom-color:#fff}
.sync{font-size:12px;color:rgba(255,255,255,.72);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:#8FE3B5;display:inline-block}
.sync.local i{background:#FFD27A}
.sync.wait i{background:rgba(255,255,255,.5)}

/* ---------- Layout ---------- */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100vh - 64px);background:linear-gradient(to right,var(--surface) 271px,var(--line) 271px,var(--line) 272px,transparent 272px)}
.rail{background:var(--surface);padding:16px 0 32px;position:sticky;top:64px;align-self:start;max-height:calc(100vh - 64px);overflow-y:auto}
.rail-title{display:flex;justify-content:space-between;align-items:baseline;padding:0 20px 8px;font-size:13px;color:var(--muted)}
.rail-group{padding:14px 20px 4px;font-size:12px;font-weight:700;color:var(--muted)}
.ri{display:grid;grid-template-columns:10px 1fr auto;column-gap:10px;row-gap:2px;align-items:center;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:9px 20px 9px 17px;cursor:pointer}
.ri:hover{background:var(--surface-2)}
.ri[aria-current="true"]{background:var(--brand-tint);border-left-color:var(--brand)}
.ri .nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri .vl{font-size:12px;color:var(--muted)}
.ri svg{grid-column:2 / 4;width:100%;height:22px;display:block;color:var(--brand)}
.ri.all .nm{font-weight:900}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.dot.today{background:var(--green)} .dot.late{background:var(--amber)} .dot.warn{background:var(--red)}
.rail-legend{padding:16px 20px 0;font-size:12px;color:var(--muted);display:grid;gap:4px}
.rail-legend span{display:flex;align-items:center;gap:8px}

main{padding:28px 32px 64px;min-width:0}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 24px;margin-bottom:22px}
.page-head h1{font-size:30px;line-height:1.15;font-weight:900;margin:0;letter-spacing:-.01em}
.page-head .sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.page-head .grow{flex:1 1 280px;min-width:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer;font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0D0F1A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0D0F1A}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.ghost{border-color:transparent;background:none}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0D0F1A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0D0F1A}}
.range{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.range .custom{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius-sm);padding:7px 10px;font-size:14px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
label.f > input,label.f > select,label.f > textarea{color:var(--ink);font-weight:400}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--brand)}

/* ---------- Panels & figures ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:20px;min-width:0}
.panel h2{font-size:17px;font-weight:900;margin:0}
.panel .ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px;margin-bottom:14px}
.panel .ph p{margin:0;font-size:13px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px}
.cols > .panel{margin-bottom:0}
.cols{margin-bottom:20px}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px}
.fig{padding:18px 22px;border-right:1px solid var(--line);min-width:0}
.fig:last-child{border-right:0}
.fig .k{font-size:13px;color:var(--muted);font-weight:700}
.fig .v{font-size:28px;font-weight:900;line-height:1.2;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fig .v small{font-size:14px;font-weight:400;color:var(--muted);margin-left:4px}
.fig .n{font-size:13px;color:var(--muted);margin-top:2px}
.up{color:var(--red)} .down{color:var(--green)}
.chart{position:relative;height:300px}
.chart.tall{height:340px}
.chart.short{height:240px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.sw.line{height:0;border-top:2px dashed var(--muted);width:16px;border-radius:0}

/* ---------- Tables ---------- */
.tw{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.high,.pill.low,.pill.warn{background:var(--amber-bg);color:var(--amber)}
.pill.drop,.pill.err{background:var(--red-bg);color:var(--red)}
.pill.ok{background:var(--green-bg);color:var(--green)}
.pill.est{background:var(--brand-tint);color:var(--brand-ink)}
.muted{color:var(--muted)}
.bar-in{height:6px;background:var(--brand);border-radius:3px;min-width:2px}
.bar-bg{background:var(--brand-tint);border-radius:3px;width:120px}

/* ---------- Entry sheet ---------- */
.entry-bar{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:16px}
.entry td input.val{width:140px;text-align:right;font-weight:700}
.entry td input.note{width:100%;min-width:140px}
.entry tr.filled td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
.entry tr.has-warn td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.entry tr.has-err td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.entry .fn{font-weight:700}
.entry .fs{font-size:12px;color:var(--muted)}
.savebar{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:16px;box-shadow:0 -8px 24px -18px rgba(11,16,159,.5)}
.progress{height:6px;background:var(--brand-tint);border-radius:3px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--brand);width:0;transition:width .2s}

/* ---------- Import ---------- */
.drop{border:2px dashed var(--line-strong);border-radius:var(--radius);padding:36px 20px;text-align:center;background:var(--surface-2);cursor:pointer}
.drop.over{border-color:var(--brand);background:var(--brand-tint)}
.drop strong{display:block;font-size:17px}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.map-row{display:grid;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2)}
.map-row .hd{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-row .hd small{font-weight:400;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;margin:12px 0 16px}
.preview{font-size:13px}
.preview td,.preview th{padding:5px 8px}

/* ---------- Manage ---------- */
.mg input.nm{width:100%;min-width:130px;font-weight:700}
.mg input.cd{width:90px}
.mg input.gp{width:110px}
.mg td{padding:6px 8px}
.order{display:inline-flex;gap:2px}
.order button{border:1px solid var(--line);background:var(--surface);border-radius:4px;width:26px;height:26px;cursor:pointer;line-height:1}
.addrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.settings{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end}

/* ---------- Empty, notices ---------- */
.empty{padding:48px 24px;text-align:center;max-width:560px;margin:40px auto}
.empty h1{font-size:28px;font-weight:900;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 20px}
.empty .actions{justify-content:center}
.notice{border:1px solid var(--line);background:var(--surface);border-left:4px solid var(--brand);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px;margin-bottom:16px}
.notice.warn{border-left-color:var(--amber)}
.loading{padding:80px 24px;text-align:center;color:var(--muted)}

/* ---------- Dialog & toast ---------- */
dialog{border:0;border-radius:var(--radius);padding:0;background:var(--surface);color:var(--ink);width:min(440px,calc(100vw - 32px));box-shadow:0 24px 60px -20px rgba(7,10,107,.45)}
dialog::backdrop{background:rgba(10,12,40,.45)}
.dlg{padding:22px 22px 18px;display:grid;gap:14px}
.dlg h3{margin:0;font-size:19px;font-weight:900}
.dlg p{margin:0;color:var(--ink-2)}
.dlg .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:4px}
.dlg .foot .left{margin-right:auto}
.dlg .hint{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:24px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--red);color:#fff}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .cols{grid-template-columns:1fr}
  .figs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fig:nth-child(2){border-right:0}
  .fig:nth-child(-n+2){border-bottom:1px solid var(--line)}
}
@media (max-width:860px){
  .top-in{flex-wrap:wrap;gap:8px 16px;padding:10px 16px 0}
  .app-name{font-size:15px;padding-left:14px}
  .logo{height:34px}
  .sync{margin-left:auto}
  .nav{order:5;width:100%;margin:0 -16px;padding:0 8px;overflow-x:auto;min-height:44px}
  .shell{grid-template-columns:1fr;background:none}
  .top{position:static}
  .rail{position:sticky;top:0;z-index:10;max-height:none;display:flex;overflow-x:auto;padding:8px 8px;border-bottom:1px solid var(--line);gap:4px}
  .rail-title,.rail-legend{display:none}
  .ri{flex:0 0 150px;border-left:0;border-bottom:3px solid transparent;padding:8px 10px;border-radius:6px 6px 0 0}
  .ri[aria-current="true"]{border-bottom-color:var(--brand)}
  main{padding:20px 16px 48px}
  .page-head h1{font-size:24px}
  .panel{padding:16px}
  .tw{margin:0 -16px;padding:0 16px}
  .chart{height:250px}
}
@media (max-width:520px){
  .figs{grid-template-columns:1fr}
  .fig{border-right:0;border-bottom:1px solid var(--line)}
  .fig:last-child{border-bottom:0}
  .fig .v{font-size:24px}
  .dlg .row{grid-template-columns:1fr}
}

/* ---------- Rail toggle, find, switcher, groups ---------- */
.icon-btn{background:none;border:0;color:#fff;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;cursor:pointer;margin-left:-8px;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.icon-btn:focus-visible,.find-btn:focus-visible,.nav button:focus-visible{outline:2px solid #fff;outline-offset:-2px}
body.rail-hidden .railfill{opacity:0}
body.rail-hidden .shell{grid-template-columns:minmax(0,1fr);background:none}
body.rail-hidden .rail{display:none}
.find-btn{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.find-btn:hover{background:rgba(255,255,255,.2)}
kbd{font-family:inherit;font-size:11px;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 5px;opacity:.7}
.rail-group{display:grid;grid-template-columns:10px 1fr auto;column-gap:10px;align-items:center;width:100%;background:none;border:0;border-left:3px solid transparent;padding:14px 20px 6px 17px;cursor:pointer;text-align:left;font-size:13px;font-weight:900;color:var(--ink)}
.rail-group .vl{font-size:12px;font-weight:700;color:var(--muted)}
.rail-group:hover{background:var(--surface-2)}
.rail-group[aria-current="true"]{background:var(--brand-tint);border-left-color:var(--brand)}
.gsw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.fcell .gsw{margin-right:8px;vertical-align:-1px}
.fstrip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 18px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.fs-grp{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding-right:14px;border-right:1px solid var(--line)}
.fs-grp:last-of-type{border-right:0}
.fstrip button{font-size:13px;font-weight:700;border:1px solid transparent;background:none;border-radius:6px;cursor:pointer;min-width:32px;height:32px;padding:0 8px;color:var(--ink-2)}
.fstrip button:hover{background:var(--surface-2);border-color:var(--line)}
.fstrip button[aria-current="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
:root[data-theme="dark"] .fstrip button[aria-current="true"]{color:#0D0F1A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fstrip button[aria-current="true"]{color:#0D0F1A}}
.fs-g{color:var(--gc)!important;font-weight:900!important;letter-spacing:.02em}
.fs-g[aria-current="true"]{background:var(--gc)!important;border-color:var(--gc)!important;color:#fff!important}
.fs-f{position:relative;font-variant-numeric:tabular-nums}
.fs-f::after{content:"";position:absolute;left:8px;right:8px;bottom:3px;height:2px;border-radius:2px;background:var(--idle);opacity:.6}
.fs-f.today::after{background:var(--green);opacity:1}.fs-f.late::after{background:var(--amber);opacity:1}.fs-f.warn::after{background:var(--red);opacity:1}
.fs-f[aria-current="true"]::after{background:#fff;opacity:.8}
.fs-all{margin-right:2px}
.fs-find{margin-left:auto;display:inline-flex;gap:8px;align-items:center;color:var(--muted)!important}
.gfig{box-shadow:inset 0 3px 0 var(--gc)}
.figs .gfig:first-child{border-top-left-radius:var(--radius)}
table tbody.grp tr.gsum td{background:var(--surface-2);border-top:2px solid var(--gc);font-size:14px}
table tbody.grp tr.gsum td:first-child{box-shadow:inset 3px 0 0 var(--gc)}
td.fcell{padding-left:22px;font-weight:700;white-space:nowrap}
.sharebar{display:flex;align-items:center;gap:8px}
.sharebar span{font-size:12px;color:var(--muted);min-width:34px}
dialog.find{width:min(520px,calc(100vw - 32px));margin-top:12vh}
.find-in{padding:14px}
.find-in input{width:100%;font-size:17px;padding:12px 14px}
#findList{list-style:none;margin:10px 0 0;padding:0;max-height:52vh;overflow-y:auto}
#findList li{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-radius:6px;cursor:pointer}
#findList li span{color:var(--muted);font-size:13px}
#findList li[aria-selected="true"]{background:var(--brand-tint)}
#findList li.none{color:var(--muted);cursor:default}
.find-hint{margin:10px 2px 0;font-size:12px;color:var(--muted)}
@media (max-width:860px){
  .find-btn span,.find-btn kbd,.fs-find kbd{display:none}
  .icon-btn{margin-left:-6px}
  .fstrip{flex-wrap:nowrap;overflow-x:auto}
  .fs-grp{flex-wrap:nowrap}
  .rail-group{flex:0 0 auto;display:flex;gap:8px;padding:8px 12px;border-left:0;border-bottom:3px solid transparent;width:auto}
  .rail-group[aria-current="true"]{border-bottom-color:var(--brand)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- Compare ---------- */
.picker{padding:14px 18px}
.pk-row{display:flex;flex-wrap:wrap;gap:10px 24px}
.pk-grp{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.pk-g{font-weight:900;font-size:13px;color:var(--gc);margin-right:4px}
.pk{min-width:36px;height:34px;padding:0 9px;border-radius:17px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-2)}
.pk:hover{border-color:var(--brand)}
.pk.on{background:var(--c);border-color:var(--c);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.pk-foot{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:13px}
.fs-cmp{margin-left:auto;color:var(--brand-ink)!important;border-color:var(--line)!important}
.fs-cmp + .fs-find{margin-left:0}
.legend.big{margin-top:12px;font-size:13px;color:var(--ink-2);gap:8px 18px}
.legend.big .sw{width:14px;height:4px;border-radius:2px}
.swpick{display:inline-block;width:24px;height:24px;border-radius:6px;background:var(--c);cursor:pointer;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swpick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.swpick:focus-within{outline:2px solid var(--brand);outline-offset:2px}
.cmp-t td.fname{font-weight:700;white-space:nowrap}
.cmp-t td.fname a{color:var(--ink);text-decoration:none}
.cmp-t td.fname a:hover{text-decoration:underline}

/* ---------- Roles ---------- */
.role-badge{display:inline-block;font-size:12px;font-weight:900;padding:3px 10px;border-radius:20px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.top .role-badge{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.3)}
.role-badge.manager{background:var(--brand-tint);color:var(--brand-ink);border-color:transparent}
.role-badge.supervisor{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.top .role-badge.manager,.top .role-badge.supervisor{background:#fff;color:#0B109F}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.roles p{margin:8px 0 0;font-size:14px;color:var(--ink-2)}
@media (max-width:860px){.roles{grid-template-columns:1fr}}
body.sup .nav,body.sup .find-btn,body.sup #railToggle,body.sup .rail{display:none}
body.sup .shell{grid-template-columns:minmax(0,1fr);background:none}
body.sup .sync{margin-left:auto}
.sup-wrap{max-width:1000px;margin:0 auto}

/* ---------- Recently added & requests ---------- */
.recent .ph{margin-bottom:8px}
details.batch{border:1px solid var(--line);border-radius:var(--radius-sm);margin-top:10px;background:var(--surface)}
details.batch[open]{border-color:var(--line-strong)}
details.batch summary{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:12px 14px;cursor:pointer;list-style:none;font-size:14px}
details.batch summary::-webkit-details-marker{display:none}
details.batch summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
details.batch[open] summary::before{transform:rotate(45deg)}
details.batch summary:hover{background:var(--surface-2)}
.b-tags{display:flex;gap:6px;margin-left:auto}
details.batch .tw{margin:0;padding:0 14px 12px}
.recent-t td{padding:7px 10px}
.recent-t td.fcell a{color:var(--ink);text-decoration:none}
.recent-t td.fcell a:hover{text-decoration:underline}
.note-cell{max-width:340px}
.note-txt{display:inline-block;background:var(--amber-bg);color:var(--ink);padding:2px 8px;border-radius:4px;font-size:13px}
.nowrap{white-space:nowrap}
.req-list{margin:4px 0 8px}
.req-list h3{font-size:14px;margin:0 0 6px}
.req{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;padding:10px 14px;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--surface)}
.req.done{border-left-color:var(--green)}
.req-msg{font-size:14px;color:var(--ink-2);margin-top:2px}
.sreq{border-color:var(--amber);background:var(--amber-bg)}
.sreq .req{background:var(--surface)}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
dialog textarea{width:100%;resize:vertical;font-family:inherit}

@media (max-width:1440px){.find-btn kbd,.sync span{display:none}.top-in{gap:16px}.nav button{padding:0 10px}}

/* ---------- Header buttons ---------- */
.hdr-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.hdr-btn:hover{background:rgba(255,255,255,.24)}
body.locked .top,body.locked .shell{visibility:hidden}

/* ---------- Login ---------- */
#login{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#0B109F 0%,#070A6B 100%);display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.lg-card{width:min(440px,100%);background:var(--surface);color:var(--ink);border-radius:16px;padding:26px 22px 22px;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
.lg-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.lg-logo{height:48px;width:auto;filter:none}
:root[data-theme="dark"] .lg-logo{filter:brightness(0) invert(1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-logo{filter:brightness(0) invert(1)}}
.lg-lang{background:none;border:1px solid var(--line-strong);border-radius:20px;padding:6px 14px;font-weight:700;cursor:pointer}
.lg-card h1{font-size:26px;font-weight:900;margin:0 0 16px}
.lg-roles{display:grid;gap:12px}
.lg-role{display:grid;grid-template-columns:52px 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:start;padding:16px;border:2px solid var(--line);border-radius:12px;background:var(--surface-2);cursor:pointer}
.lg-role:hover,.lg-role:focus-visible{border-color:var(--brand)}
.lg-role .lg-ico{grid-row:1 / 3;width:52px;height:52px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:24px}
.lg-role strong{font-size:20px}
.lg-role small{color:var(--muted);font-size:14px}
.lg-lbl{display:block;font-weight:700;margin-bottom:6px}
.lg-pw{display:flex;gap:8px}
.lg-pw input{flex:1;font-size:20px;padding:14px;border-radius:10px}
.lg-pw button{width:56px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);font-size:20px;cursor:pointer}
.lg-btn{display:block;width:100%;margin-top:14px;padding:16px;border-radius:12px;border:0;background:var(--brand);color:#fff;font-size:18px;font-weight:900;cursor:pointer}
:root[data-theme="dark"] .lg-btn{color:#0D0F1A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-btn{color:#0D0F1A}}
.lg-btn.ghost{background:none;color:var(--ink-2);border:1px solid var(--line-strong);font-size:16px}
.lg-btn:disabled{opacity:.6}
.lg-msg{margin-top:12px;padding:12px 14px;border-radius:10px;font-weight:700;font-size:15px}
.lg-msg.err{background:var(--red-bg);color:var(--red)}
.lg-msg.warn{background:var(--amber-bg);color:var(--amber);margin:0 0 4px}

/* ---------- Simple supervisor app ---------- */
main.sp-main{padding:16px 14px 32px}
.sp{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sp .loading{padding:60px 0}
.sp-msg{padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:17px;font-weight:700;text-align:center}
.sp-msg.red{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.sp-big{width:100%;padding:20px;border-radius:14px;border:0;background:var(--brand);color:#fff;font-size:21px;font-weight:900;cursor:pointer}
:root[data-theme="dark"] .sp-big{color:#0D0F1A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sp-big{color:#0D0F1A}}
.sp-days{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sp-day{padding:16px 10px;border-radius:14px;border:2px solid var(--line-strong);background:var(--surface);cursor:pointer;display:grid;gap:2px}
.sp-day strong{font-size:20px}.sp-day span{color:var(--muted);font-size:14px}
.sp-day.on{border-color:var(--brand);background:var(--brand-tint)}
.sp-state{text-align:center;font-size:16px;font-weight:700;color:var(--muted);padding:6px}
.sp-state.sent{color:var(--green)}
.sp-reqs{background:var(--amber-bg);border:2px solid var(--amber);border-radius:14px;padding:12px}
.sp-reqs-t{font-weight:900;color:var(--amber);margin-bottom:8px;font-size:16px}
.sp-req{display:grid;gap:2px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px;cursor:pointer;font-size:16px}
.sp-req span{color:var(--ink-2);font-size:15px}.sp-req em{font-style:normal;font-weight:900;color:var(--brand-ink)}
.sp-dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sp-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);padding:0;cursor:pointer}
.sp-dot.ok{background:var(--green);border-color:var(--green)}
.sp-dot.confirmed{background:var(--amber);border-color:var(--amber)}
.sp-dot.red{background:var(--red);border-color:var(--red)}
.sp-dot.cur{outline:3px solid var(--brand);outline-offset:2px}
.sp-head{text-align:center;color:var(--muted);font-weight:700}
.sp-card{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--gc);border-radius:16px;padding:16px;display:grid;gap:8px;text-align:center}
.sp-name{font-size:40px;font-weight:900;line-height:1}
.sp-last{color:var(--ink-2);font-size:16px;min-height:22px}
.sp-num{font-size:40px;font-weight:900;padding:12px;border-radius:12px;border:3px solid var(--line-strong);background:var(--surface-2);min-height:74px;word-break:break-all;font-variant-numeric:tabular-nums}
.sp-num .ph{font-size:18px;font-weight:400;color:var(--muted)}
.sp-num.ok{border-color:var(--green)}
.sp-num.red{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.sp-num.confirmed{border-color:var(--amber)}
.sp-check{font-size:16px;font-weight:700;min-height:24px}
.sp-check.ok{color:var(--green)}.sp-check.red{color:var(--red)}.sp-check.confirmed{color:var(--amber)}
.sp-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sp-chip{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:22px;padding:8px 14px;font-weight:700;font-size:15px;cursor:pointer;display:grid;line-height:1.2}
.sp-chip small{font-weight:400;font-size:11px;color:var(--muted)}
.sp-chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}.sp-chip.on small{color:#fff}
.sp-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sp-key{height:62px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-size:28px;font-weight:700;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.sp-key:active{background:var(--brand-tint)}
.sp-key.del{font-size:24px;color:var(--red)}
.sp-nav{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.sp-btn{padding:18px 10px;border-radius:14px;border:0;background:var(--brand);color:#fff;font-size:19px;font-weight:900;cursor:pointer}
:root[data-theme="dark"] .sp-btn:not(.ghost):not(.red){color:#0D0F1A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sp-btn:not(.ghost):not(.red){color:#0D0F1A}}
.sp-btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.sp-btn.red{background:var(--red);color:#fff}
.sp-btn.send{background:var(--green);color:#fff}
.sp-btn:disabled{opacity:.6}
.sp-sum{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.sp-sum span{padding:6px 12px;border-radius:20px;background:var(--surface-2);font-weight:700}
.sp-sum .g{background:var(--green-bg);color:var(--green)}.sp-sum .r{background:var(--red-bg);color:var(--red)}
.sp-hint{text-align:center;color:var(--muted);margin:0}
.sp-list{display:grid;gap:6px}
.sp-row{display:grid;grid-template-columns:1fr auto 28px;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px;cursor:pointer;text-align:start}
.sp-row .nm{font-weight:900}.sp-row .v{font-variant-numeric:tabular-nums;font-weight:700}.sp-row .s{text-align:center;font-weight:900}
.sp-row .nt{grid-column:1 / -1;font-size:13px;color:var(--muted)}
.sp-row.ok .s{color:var(--green)}.sp-row.red{border-color:var(--red);background:var(--red-bg)}.sp-row.red .s,.sp-row.red .v{color:var(--red)}
.sp-row.confirmed .s{color:var(--amber)}.sp-row.empty .v{color:var(--muted)}
.sp-done{text-align:center;padding-top:30px}
.sp-tick{width:96px;height:96px;margin:0 auto;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:56px;font-weight:900}
.sp-done h2{font-size:26px;margin:10px 0 0}.sp-done p{font-size:18px;color:var(--ink-2);margin:0 0 10px}
body.sup .role-badge{display:none}
@media (max-width:860px){ body.sup .top-in{flex-wrap:nowrap;padding:10px 12px} body.sup .app-name{display:none} }

/* the supervisor app's "empty" state must not pick up the page-level .empty block */
.sp .empty{max-width:none;margin:0;text-align:inherit}
.sp-row.empty{padding:12px 14px;text-align:start}
.sp-num.empty{padding:12px}
.sp-check.empty,.sp-dot.empty{padding:0}
@media (max-height:900px){
  .sp{gap:10px}
  .sp-card{padding:12px 14px;gap:6px}
  .sp-num,.sp-num.empty{font-size:34px;min-height:60px;padding:8px}
  .sp-key{height:54px;font-size:26px}
  .sp-chips .sp-chip small{display:none}
}
body{visibility:hidden}
body.ok{visibility:visible}
</style>
</head>

    <label class="f">Furnace<select id="drFurnace" required></select></label>
    <div class="row">
      <label class="f">Date<input type="date" id="drDate" required></label>
      <label class="f"><span id="drValLabel">Meter reading</span><input type="number" step="any" id="drVal" required inputmode="decimal"></label>
    </div>
    <label class="f">Note<input type="text" id="drNote" placeholder="Optional, e.g. burner maintenance"></label>
    <div class="hint" id="drHint"></div>
    <div class="foot">
      <button type="button" class="btn danger left" id="drDelete">Delete reading</button>
      <button type="button" class="btn ghost" id="drCancel">Cancel</button>
      <button type="submit" class="btn primary" id="drSave">Save reading</button>
    </div>
  </form>
</dialog>

<dialog id="dlgConfirm">
  <form class="dlg" method="dialog">
    <h3 id="dcTitle"></h3>
    <p id="dcBody"></p>
    <label class="f" id="dcTypeWrap" hidden><span id="dcTypeLabel"></span><input type="text" id="dcType" autocomplete="off"></label>
    <div class="foot">
      <button type="button" class="btn ghost" id="dcCancel">Cancel</button>
      <button type="button" class="btn primary" id="dcOk">OK</button>
    </div>
  </form>
</dialog>

<dialog id="dlgAsk">
  <form class="dlg" method="dialog" id="formAsk">
    <h3 id="askTitle">Ask to change</h3>
    <p class="hint" id="askInfo"></p>
    <label class="f">Message to the supervisor<textarea id="askMsg" rows="3" placeholder="What should he check or correct?"></textarea></label>
    <div class="qchips">
      <button type="button" class="btn small" data-q="Please check the decimal point.">Decimal point?</button>
      <button type="button" class="btn small" data-q="Reading looks lower than the previous day — please re-read the meter.">Lower than before</button>
      <button type="button" class="btn small" data-q="Usage looks too high — please re-read the meter.">Too high</button>
      <button type="button" class="btn small" data-q="Please add a note explaining this reading.">Add a note</button>
    </div>
    <div class="foot">
      <button type="button" class="btn ghost" id="askCancel">Cancel</button>
      <button type="submit" class="btn primary">Send request</button>
    </div>
  </form>
</dialog>

<dialog id="dlgFind" class="find">
  <div class="find-in">
    <input id="findQ" type="text" placeholder="Type a furnace, e.g. hf3 or tf 10" autocomplete="off" role="combobox" aria-controls="findList" aria-expanded="true" aria-label="Find a furnace">
    <ul id="findList" role="listbox"></ul>
    <p class="find-hint">↑ ↓ to move · Enter to open · Esc to close · on a furnace page use ← → to step through</p>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
